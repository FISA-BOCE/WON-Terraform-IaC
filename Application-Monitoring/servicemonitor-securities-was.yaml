apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: card-channel-server
  namespace: monitoring
  labels:
    app: card-channel-server
spec:
  namespaceSelector:
    matchNames:
      - card-channel-dev

  selector:
    matchLabels:
      app.kubernetes.io/name: card-channel-server
      app.kubernetes.io/instance: card-channel-dev

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s