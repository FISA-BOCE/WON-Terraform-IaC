apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thanos-query
  template:
    metadata:
      labels:
        app: thanos-query
    spec:
      containers:
        - name: thanos-query
          image: quay.io/thanos/thanos:v0.39.0
          args:
            - query
            - --log.level=info

            # Grafana가 붙을 HTTP API
            - --http-address=0.0.0.0:9090

            # Thanos Query 내부 gRPC
            - --grpc-address=0.0.0.0:10901

            # HA 중복 제거 기준 label
            - --query.replica-label=replica

            # Thanos Sidecar discovery service
            # release/namespace에 따라 service 이름은 다를 수 있음
            - --endpoint=dnssrv+_grpc._tcp.monitoring-kube-prometheus-thanos-discovery.monitoring.svc.cluster.local

          ports:
            - name: http
              containerPort: 9090
            - name: grpc
              containerPort: 10901

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: thanos-query
  ports:
    - name: http
      port: 9090
      targetPort: http
    - name: grpc
      port: 10901
      targetPort: grpc