---
- name: Configure AI database servers
  hosts: ai_db
  become: true

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 180

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3-pymysql
        state: present
        update_cache: true

- name: Install and configure MySQL 8.0
  hosts: mysql
  become: true

  tasks:
    - name: Install MySQL 8.0 server
      ansible.builtin.apt:
        name: mysql-server-8.0
        state: present
        update_cache: true

    - name: Deploy MySQL server configuration
      ansible.builtin.template:
        src: templates/mysqld.cnf.j2
        dest: /etc/mysql/mysql.conf.d/mysqld.cnf
        owner: root
        group: root
        mode: "0644"
      notify: Restart MySQL

    - name: Ensure MySQL is enabled and running
      ansible.builtin.systemd:
        name: mysql
        enabled: true
        state: started

    - name: Check MySQL root password
      ansible.builtin.command: "mysqladmin --user=root --password={{ mysql_root_password }} status"
      register: mysql_root_password_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Set MySQL root password
      community.mysql.mysql_user:
        name: root
        host: localhost
        password: "{{ mysql_root_password }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        check_implicit_admin: true
        state: present
      when: mysql_root_password_check.rc != 0
      no_log: true

    - name: Create AI database
      community.mysql.mysql_db:
        name: "{{ mysql_database_name }}"
        encoding: utf8mb4
        collation: utf8mb4_0900_ai_ci
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        state: present
      no_log: true

    - name: Create AI database user
      community.mysql.mysql_user:
        name: "{{ mysql_app_user }}"
        password: "{{ mysql_app_password }}"
        host: "%"
        priv: "{{ mysql_database_name }}.*:ALL"
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        state: present
      no_log: true

    - name: Verify MySQL version
      ansible.builtin.command: mysql --version
      register: mysql_version
      changed_when: false

    - name: Print MySQL version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ mysql_version.stdout | default('mysql version output unavailable') }}"

  handlers:
    - name: Restart MySQL
      ansible.builtin.systemd:
        name: mysql
        state: restarted

- name: Install and configure Neo4j
  hosts: neo4j
  become: true

  tasks:
    - name: Add Neo4j apt key
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://debian.neo4j.com/neotechnology.gpg.key \
          | gpg --dearmor -o /usr/share/keyrings/neo4j.gpg
      args:
        executable: /bin/bash
        creates: /usr/share/keyrings/neo4j.gpg

    - name: Add Neo4j apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/neo4j.list
        owner: root
        group: root
        mode: "0644"
        content: |
          deb [signed-by=/usr/share/keyrings/neo4j.gpg] https://debian.neo4j.com stable latest

    - name: Install Neo4j
      ansible.builtin.apt:
        name: neo4j
        state: present
        update_cache: true

    - name: Deploy Neo4j configuration
      ansible.builtin.template:
        src: templates/neo4j.conf.j2
        dest: /etc/neo4j/neo4j.conf
        owner: neo4j
        group: adm
        mode: "0644"
      notify: Restart Neo4j

    - name: Check Neo4j auth initialization file
      ansible.builtin.stat:
        path: /var/lib/neo4j/data/dbms/auth.ini
      register: neo4j_auth_ini

    - name: Stop Neo4j before initial password setup
      ansible.builtin.systemd:
        name: neo4j
        state: stopped
      when: not neo4j_auth_ini.stat.exists

    - name: Set initial Neo4j password
      ansible.builtin.command: "neo4j-admin dbms set-initial-password {{ neo4j_initial_password }}"
      when: not neo4j_auth_ini.stat.exists

    - name: Ensure Neo4j is enabled and running
      ansible.builtin.systemd:
        name: neo4j
        enabled: true
        state: started

    - name: Verify Neo4j version
      ansible.builtin.command: neo4j --version
      register: neo4j_version
      changed_when: false

    - name: Print Neo4j version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ neo4j_version.stdout | default('neo4j version output unavailable') }}"

  handlers:
    - name: Restart Neo4j
      ansible.builtin.systemd:
        name: neo4j
        state: restarted
